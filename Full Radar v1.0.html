<!DOCTYPE html>
<html lang="en" class="js">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FullRadar — Weather forecast</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,300;12..96,500;12..96,700&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --body:"Instrument Sans","Segoe UI",system-ui,sans-serif;
  --ink:#f3f1fb; --ink-2:rgba(243,241,251,.68); --ink-3:rgba(243,241,251,.42);
  --glass:rgba(255,255,255,.07); --glass-2:rgba(255,255,255,.12); --line:rgba(255,255,255,.14);
  /* theme tokens, swapped by JS */
  --g1:#0a0724; --g2:#3d1a6b; --g3:#4a2fa0; --accent:#a98bff;
}
[data-theme="night"]{--g1:#08061f;--g2:#351460;--g3:#3d2790;--accent:#a98bff}
[data-theme="cool"]{--g1:#0b0a2c;--g2:#45267a;--g3:#6f44b0;--accent:#c09bff}
[data-theme="mild"]{--g1:#140d34;--g2:#3a2a8a;--g3:#7a5ad0;--accent:#c4b0ff}
[data-theme="warm"]{--g1:#240f33;--g2:#7a2f8a;--g3:#d65aa0;--accent:#e3a0ff}
[data-theme="hot"]{--g1:#2c0e2c;--g2:#9a2f7a;--g3:#f06a9a;--accent:#f0a8ff}
[data-theme="rain"]{--g1:#0c0a1e;--g2:#372450;--g3:#4a4278;--accent:#a99bd8}
*{box-sizing:border-box;margin:0}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  min-height:100vh;font-family:var(--body);color:var(--ink);
  background:var(--g1);   /* the canvas paints the real sky; no fixed gradient to repaint on scroll */
  -webkit-font-smoothing:antialiased;
}
.shell{max-width:1040px;margin:0 auto;padding:clamp(20px,5vw,56px) clamp(16px,4vw,32px) 64px}
header{display:flex;align-items:baseline;justify-content:space-between;gap:16px;margin-bottom:clamp(28px,6vw,64px)}
.brand{font-family:var(--display);font-weight:700;font-size:1.25rem;letter-spacing:.02em}
.brand-sub{color:var(--ink-3);font-size:.85rem}

h1{font-family:var(--display);font-weight:300;font-size:clamp(2rem,6vw,3.5rem);line-height:1.05;letter-spacing:-.02em;max-width:14ch;margin-bottom:24px}

form{position:relative;max-width:560px}
.field{display:flex;align-items:center;gap:12px;padding:6px 6px 6px 18px;border-radius:999px;
  background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  transition:border-color .2s,box-shadow .2s,background .2s}
.field:focus-within{border-color:var(--accent);background:var(--glass-2);box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 22%,transparent)}
.field svg{flex:none;color:var(--ink-3)}
.field:focus-within>svg{color:var(--accent)}
input{flex:1;min-width:0;background:none;border:0;outline:0;color:var(--ink);font:500 1rem var(--body);padding:12px 0}
input::placeholder{color:var(--ink-3)}
button.go{border:0;cursor:pointer;font:600 .95rem var(--body);color:#0b1030;background:var(--accent);padding:12px 22px;border-radius:999px;transition:transform .15s,filter .2s}
button.go:hover{filter:brightness(1.08)}button.go:active{transform:scale(.97)}
button.go:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
button.go[disabled]{opacity:.6;cursor:progress}
.status{height:22px;margin:10px 0 0 18px;font-size:.85rem;color:var(--ink-3);display:flex;align-items:center;gap:8px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--ink-3)}
.status.busy .dot{background:var(--accent);animation:pulse 1s infinite}
.status.ok .dot{background:#7be3a1}.status.err .dot{background:#ff8a8a}
@keyframes pulse{50%{opacity:.25}}

main{margin-top:clamp(24px,5vw,48px)}
.card{background:var(--glass);border:1px solid var(--line);border-radius:24px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);padding:clamp(18px,3vw,28px)}
.dash{display:grid;gap:16px;grid-template-columns:repeat(12,1fr)}
.hero{grid-column:span 12;display:flex;flex-direction:column;justify-content:space-between;gap:28px;min-height:280px}
.place{display:flex;align-items:center;gap:8px;color:var(--ink-2);font-size:.95rem}
.coords{color:var(--ink-3);font-size:.85rem;margin-top:4px}
.temp{font-family:var(--display);font-weight:300;font-size:clamp(6rem,24vw,12rem);line-height:.85;letter-spacing:-.05em;display:flex;align-items:flex-start}
.temp sup{font-size:.28em;font-weight:500;margin:.35em 0 0 .08em;letter-spacing:0;color:var(--accent)}
.cond{font-size:1.15rem;color:var(--ink-2);margin-top:14px}
.metrics{grid-column:span 12;display:grid;gap:16px;grid-template-columns:repeat(2,1fr)}
.metric{display:flex;flex-direction:column;gap:18px}
.metric .lbl{display:flex;align-items:center;gap:8px;color:var(--ink-2);font-size:.9rem}
.metric .lbl svg{color:var(--accent)}
.metric .val{font-family:var(--display);font-size:clamp(1.8rem,5vw,2.4rem);font-weight:500;letter-spacing:-.02em}
.metric .val small{font-family:var(--body);font-size:.45em;font-weight:500;color:var(--ink-3);margin-left:4px;letter-spacing:0}
.bar{height:4px;border-radius:4px;background:var(--glass-2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:4px;transition:width .9s cubic-bezier(.2,.8,.2,1)}
.hint{font-size:.8rem;color:var(--ink-3)}
.range,.horizon{grid-column:span 12}
.range h2,.horizon h2{font-family:var(--display);font-weight:500;font-size:1.05rem;margin-bottom:20px}
.minmax{display:grid;grid-template-columns:auto 1fr auto;gap:16px;align-items:center}
.minmax .n{font-family:var(--display);font-size:2rem;font-weight:500}
.minmax .n span{display:block;font:400 .8rem var(--body);color:var(--ink-3);margin-bottom:2px}
.minmax .n:last-child{text-align:right}
.track{height:8px;border-radius:8px;background:linear-gradient(90deg,#b68cff,var(--accent),#ff9ad5);position:relative}
.track b{position:absolute;top:50%;width:16px;height:16px;border-radius:50%;background:var(--ink);border:3px solid var(--g1);transform:translate(-50%,-50%);transition:left .9s cubic-bezier(.2,.8,.2,1)}
.arc{width:100%;height:auto;display:block;overflow:visible}
.times{display:flex;justify-content:space-between;margin-top:8px}
.times div{display:flex;align-items:center;gap:10px}
.times svg{color:var(--accent)}
.times strong{font:500 1.35rem var(--display);display:block}
.times span{font-size:.8rem;color:var(--ink-3)}
.times div:last-child{text-align:right;flex-direction:row-reverse}

.empty,.err{text-align:center;padding:clamp(32px,8vw,64px) 20px;display:flex;flex-direction:column;align-items:center;gap:12px}
.empty svg,.err svg{color:var(--accent)}
.empty h2,.err h2{font-family:var(--display);font-weight:500;font-size:1.3rem}
.empty p,.err p{color:var(--ink-2);max-width:40ch;line-height:1.5}
.chips{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:8px}
.chip{font:500 .85rem var(--body);color:var(--ink);background:var(--glass);border:1px solid var(--line);padding:8px 14px;border-radius:999px;cursor:pointer;transition:background .2s}
.chip:hover{background:var(--glass-2)}.chip:focus-visible{outline:2px solid var(--accent)}
.sk{border-radius:12px;background:linear-gradient(100deg,var(--glass) 30%,var(--glass-2) 50%,var(--glass) 70%);background-size:200% 100%;animation:sh 1.3s infinite linear}
@keyframes sh{to{background-position:-200% 0}}

@keyframes rise{from{opacity:0;transform:translateY(14px)}}
footer{margin-top:40px;color:var(--ink-3);font-size:.8rem}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

@media(min-width:760px){
  .hero{grid-column:span 7}
  .metrics{grid-column:span 5;grid-template-columns:repeat(2,1fr)}
  .range{grid-column:span 5}.horizon{grid-column:span 7}
}


/* =====================================================================
   FULLRADAR INTRO (logo reveal)  -  CSS
   Only `transform` and `opacity` are animated (compositor-only: no layout, no repaint).
   Colours come from the variables on .fr-intro; data-theme="light" gives the logo on white.
   ===================================================================== */
.fr-intro{
  --fr-bg1:#070a24; --fr-bg2:#141a56; --fr-ink:#f3f1fb;
  --fr-p1:#c9b8ff; --fr-p2:#9272ff; --fr-p3:#5b34d6;      /* logo gradient: top / middle / bottom */
  --fr-acc-rgb:185,166,255;                               /* radar glow */
  --fr-font:"Bricolage Grotesque","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
  --P:2.4s;            /* one full turn of the radar pointer              */
  --t-exit:3.3s;       /* when the intro starts leaving (JS may shorten)  */
  --w:300px;           /* logo width (fluid value set in @supports)       */
  --ease:cubic-bezier(.22,1,.36,1);
  --bounce:cubic-bezier(.34,1.56,.64,1);                  /* back-out curve = tactile overshoot */
  position:fixed;top:0;right:0;bottom:0;left:0;z-index:1000;
  display:flex;align-items:center;justify-content:center;overflow:hidden;
  padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px);
  color:var(--fr-ink);cursor:pointer;
  background:radial-gradient(70% 55% at 85% 0%,#2d2670,transparent 70%),radial-gradient(80% 70% at 0% 100%,var(--fr-bg2),transparent 70%),var(--fr-bg1);
  contain:layout paint;-webkit-tap-highlight-color:transparent;
  transition:opacity .7s ease,transform .7s var(--ease),visibility 0s linear .7s;
}
.fr-intro[data-theme="light"]{--fr-bg1:#fbfaff;--fr-ink:#2e1a7a;--fr-p1:#7b52ff;--fr-p2:#5a35d8;--fr-p3:#2e1a7a;--fr-acc-rgb:123,82,255;background:var(--fr-bg1)}
@supports (width:min(1px,2px)){ .fr-intro{--w:min(78vw,520px)} }
.fr-intro.is-leaving{opacity:0;transform:scale(1.04);visibility:hidden;pointer-events:none}
.fr-sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.fr-defs{position:absolute;width:0;height:0}

/* hold every animation until fonts are ready (JS adds .is-playing); without JS they just run */
.js .fr-intro:not(.is-playing),.js .fr-intro:not(.is-playing) *,
.js .fr-intro:not(.is-playing) *::before,.js .fr-intro:not(.is-playing) *::after{animation-play-state:paused!important}

.fr-stage{display:flex;flex-direction:column;align-items:center;gap:clamp(16px,4vmin,30px);max-width:100%}
.fr-logo{position:relative;width:var(--w);height:calc(var(--w) * .617)}     /* 470 : 290 logo box */
.fr-layer{position:absolute;left:0;top:0;width:100%;height:100%;overflow:visible}

/* cloud: pops in place */
.fr-cloudl{opacity:0;transform:scale(.5);transform-origin:55.3% 44.8%;will-change:transform,opacity;animation:fr-pop .9s var(--bounce) .05s forwards}

/* radar: pops in place, then the pointer turns forever */
.fr-radar{position:absolute;left:0;top:0;width:100%;height:100%;opacity:0;transform:scale(.5);transform-origin:21.5% 64.8%;
  will-change:transform,opacity;animation:fr-pop .9s var(--bounce) .3s forwards}
.fr-hand{position:absolute;left:calc(21.49% - 21.28%);top:calc(64.83% - 34.48%);width:42.55%;height:68.97%;
  will-change:transform;animation:fr-rot var(--P) linear .3s infinite}
.fr-hand svg{position:absolute;left:0;top:0;width:100%;height:100%;overflow:visible}
.fr-wedge{position:absolute;left:12.5%;top:12.5%;width:75%;height:75%;border-radius:50%;
  background:conic-gradient(from -23deg,rgba(var(--fr-acc-rgb),0) 0deg,rgba(var(--fr-acc-rgb),.42) 70deg,rgba(var(--fr-acc-rgb),0) 70.4deg)}
@supports not (background:conic-gradient(red,blue)){ .fr-wedge{display:none} }   /* old browsers: pointer only */
.fr-ping{position:absolute;left:3.62%;top:35.86%;width:35.74%;height:57.93%;border-radius:50%;
  border:1px solid rgba(var(--fr-acc-rgb),.6);opacity:0;animation:fr-ping var(--P) ease-out .6s infinite}

/* F then R slide in, left to right */
.fr-f,.fr-r{opacity:0;transform:translate3d(-14%,0,0);will-change:transform,opacity;animation:fr-slide .6s var(--ease) var(--d) forwards}
.fr-f{--d:.8s}.fr-r{--d:1s}

.fr-word{margin:0;font:300 clamp(1.2rem,4.6vw,1.7rem)/1 var(--fr-font);letter-spacing:.22em;text-transform:uppercase;
  opacity:0;transform:translate3d(0,10px,0);animation:fr-up .8s var(--ease) 1.35s forwards}
.fr-word b{font-weight:700}
.fr-bar{width:min(46vw,200px);height:2px;border-radius:2px;background:rgba(127,127,160,.25);overflow:hidden}
.fr-bar i{display:block;width:100%;height:100%;background:var(--fr-p2);transform-origin:left;transform:scaleX(0);
  animation:fr-bar calc(var(--t-exit) - .2s) cubic-bezier(.4,0,.2,1) .2s forwards}

/* ---- keyframes (transform / opacity only) ---- */
@keyframes fr-fade{to{opacity:1}}
@keyframes fr-pop{from{opacity:0;transform:scale(.5)}to{opacity:1;transform:scale(1)}}
@keyframes fr-rot{to{transform:rotate(360deg)}}
@keyframes fr-ping{0%{opacity:.6;transform:scale(.12)}100%{opacity:0;transform:scale(1)}}
@keyframes fr-slide{to{opacity:1;transform:translate3d(0,0,0)}}
@keyframes fr-up{to{opacity:1;transform:translate3d(0,0,0)}}
@keyframes fr-bar{to{transform:scaleX(1)}}

/* no-JS fallback: leave automatically */
.no-js .fr-intro{animation:fr-auto-exit .7s var(--ease) var(--t-exit) forwards}
@keyframes fr-auto-exit{to{opacity:0;transform:scale(1.04);visibility:hidden}}

/* reduced motion (JS sets data-motion="reduced" unless data-respect-reduced-motion="false"): fades only, pointer rests */
.fr-intro[data-motion="reduced"] .fr-hand,.fr-intro[data-motion="reduced"] .fr-ping{animation:none}
.fr-intro[data-motion="reduced"] .fr-cloudl,.fr-intro[data-motion="reduced"] .fr-radar,.fr-intro[data-motion="reduced"] .fr-f,
.fr-intro[data-motion="reduced"] .fr-r,.fr-intro[data-motion="reduced"] .fr-word{animation-name:fr-fade;transform:none}

/* ---------- hand-off to the dashboard ---------- */
.shell{opacity:0;position:relative;z-index:1}
body.ready .shell{opacity:1;transition:opacity 1s ease .3s}
#out{transition:opacity .22s ease,transform .22s ease}
#out.fade{opacity:0;transform:translateY(6px)}
.reveal>*{animation:rise .7s cubic-bezier(.2,.8,.2,1) backwards}
.reveal>*:nth-child(2){animation-delay:.08s}.reveal>*:nth-child(3){animation-delay:.16s}
.reveal>*:nth-child(4){animation-delay:.24s}.reveal>*:nth-child(5){animation-delay:.32s}
/* ---------- Card hover / press reaction ---------- */
.dash .card{position:relative;transition:transform .8s cubic-bezier(.22,1,.36,1),background .7s ease,border-color .7s ease,box-shadow .7s ease;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.dash .card.lift{transform:scale(1.015);background:var(--glass-2);border-color:color-mix(in srgb,var(--accent) 45%,transparent);box-shadow:0 22px 44px -16px rgba(0,0,0,.5),0 0 0 1px color-mix(in srgb,var(--accent) 18%,transparent);z-index:2;transition-duration:.55s,.5s,.5s,.5s}
.dash .metric.lift,.dash .fav.lift{transform:scale(1.04)}
@media(hover:hover){
  .dash .card:hover{transform:scale(1.015);background:var(--glass-2);border-color:color-mix(in srgb,var(--accent) 45%,transparent);box-shadow:0 22px 44px -16px rgba(0,0,0,.5),0 0 0 1px color-mix(in srgb,var(--accent) 18%,transparent);z-index:2;transition-duration:.55s,.5s,.5s,.5s}
  .dash .metric:hover,.dash .fav:hover{transform:scale(1.04)}
}
/* ---------- Smart warnings ---------- */
.warn{grid-column:span 12}
.warn-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}
.warn-head h2{font-family:var(--display);font-weight:500;font-size:1.05rem}
.pill{font:600 .75rem var(--body);padding:5px 12px;border-radius:999px;background:var(--glass-2);color:var(--ink-2);border:1px solid var(--line)}
.pill.hot{background:rgba(255,170,90,.16);color:#ffc58a;border-color:rgba(255,170,90,.45)}
.wlist{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.wi{display:flex;gap:14px;align-items:flex-start;padding:16px;border-radius:18px;border:1px solid var(--line);background:rgba(255,255,255,.04)}
.wi .wic{flex:none;width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:var(--glass-2);color:var(--accent)}
.wi strong{display:block;font:600 .95rem var(--body);margin-bottom:4px}
.wi p{font-size:.88rem;line-height:1.45;color:var(--ink-2)}
.wi.alert{border-color:rgba(255,170,90,.45);background:rgba(255,170,90,.09)}
.wi.alert .wic{background:rgba(255,170,90,.2);color:#ffc58a}
.wi.ok .wic{color:#7be3a1}
/* ---------- Favorites ---------- */
.favs{display:none;align-items:center;gap:8px;flex-wrap:wrap;margin-top:16px;max-width:760px}
.favs.on{display:flex}
.favs .lbl{font-size:.8rem;color:var(--ink-3);margin-right:4px}
.fchip{display:inline-flex;align-items:center;background:var(--glass);border:1px solid var(--line);border-radius:999px;transition:background .3s,border-color .3s}
.fchip:hover{background:var(--glass-2);border-color:color-mix(in srgb,var(--accent) 40%,transparent)}
.fchip button{background:none;border:0;color:var(--ink);font:500 .85rem var(--body);cursor:pointer;padding:8px 6px 8px 14px}
.fchip button.x{padding:8px 12px 8px 4px;color:var(--ink-3);font-size:1.05rem;line-height:1}
.fchip button.x:hover{color:#ff9b9b}
.fchip button:focus-visible,.favbtn:focus-visible{outline:2px solid var(--accent);border-radius:999px}
.vall{font:600 .85rem var(--body);color:var(--accent);background:none;border:1px solid color-mix(in srgb,var(--accent) 50%,transparent);border-radius:999px;padding:8px 14px;cursor:pointer;transition:background .3s}
.vall:hover{background:color-mix(in srgb,var(--accent) 14%,transparent)}
.hero-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.favbtn{display:inline-flex;align-items:center;gap:6px;font:500 .85rem var(--body);color:var(--ink-2);background:var(--glass);border:1px solid var(--line);border-radius:999px;padding:8px 14px;cursor:pointer;transition:all .3s ease}
.favbtn.on{color:var(--accent);border-color:color-mix(in srgb,var(--accent) 50%,transparent)}
.favbtn.on svg{fill:currentColor}
.fav-head{grid-column:span 12;display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.fav-head h2{font-family:var(--display);font-weight:500;font-size:1.3rem}
.favgrid .fav{grid-column:span 12;text-align:left;font:inherit;color:inherit;cursor:pointer;display:flex;flex-direction:column;gap:10px;appearance:none;-webkit-appearance:none}
@media(min-width:700px){.favgrid .fav{grid-column:span 6}}
@media(min-width:980px){.favgrid .fav{grid-column:span 4}}
.fav-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.fav-temp{font-family:var(--display);font-weight:300;font-size:3.6rem;line-height:1;letter-spacing:-.04em}
.fav-temp sup{font-size:.32em;color:var(--accent);margin-left:3px;vertical-align:top;position:relative;top:.5em;letter-spacing:0}
.fav-meta{display:flex;gap:14px;flex-wrap:wrap;color:var(--ink-2);font-size:.85rem}
.fav-meta span{display:inline-flex;gap:6px;align-items:center}
.fav-meta svg{width:15px;height:15px;color:var(--accent)}
/* ---------- Atmosphere canvas (drawn by the engine below) ---------- */
#atmo{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none;display:block;transform:translateZ(0)}
/* set by the engine when a device cannot keep up: drop the glass blur, keep the look */
html.lite .card,html.lite .field,html.lite .dash .card,html.lite .dash .card:hover,html.lite .dash .card.lift{backdrop-filter:none;-webkit-backdrop-filter:none;background:rgba(22,14,52,.42)}
/* ---------- Next 7 days ---------- */
.week{grid-column:span 12}
.week h2{font-family:var(--display);font-weight:500;font-size:1.05rem;margin-bottom:8px}
.wk{display:grid;grid-template-columns:62px 58px 1fr 76px;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.wk:first-of-type{border-top:0}
.wk-d strong{display:block;font:600 .95rem var(--body)}
.wk-d span{font-size:.75rem;color:var(--ink-3)}
.wk-r{display:flex;align-items:center;gap:6px;font-size:.85rem;color:var(--ink-2)}
.wk-r svg{width:14px;height:14px;color:var(--accent)}
.wk-b{position:relative;height:6px;border-radius:6px;background:var(--glass-2)}
.wk-b i{position:absolute;top:0;bottom:0;border-radius:6px;background:linear-gradient(90deg,#b68cff,var(--accent),#ff9ad5)}
.wk-t{display:flex;justify-content:flex-end;gap:10px;font-size:.9rem;color:var(--ink-3)}
.wk-t strong{color:var(--ink);font-weight:600}

<script>

/* =====================================================================
   FULLRADAR INTRO  -  controller (no dependencies, no animation loop)
   All motion is CSS; this only: waits for fonts, schedules the exit,
   handles skip (tap / Esc / Enter / Space), leaves early if the tab is hidden,
   and removes every node + listener when done (nothing left running).
   Events on window:  fullradar:intro-soon (~0.5s before leaving)
                      fullradar:intro-leave (leaving starts)   fullradar:intro-end (removed)
   ===================================================================== */
(function () {
  "use strict";
  var root = document.getElementById("fr-intro");
  if (!root) return;
  var timers = [], playing = false, left = false, gone = false;

  function emit(name) {
    try { window.dispatchEvent(new CustomEvent(name)); }
    catch (e) { try { var ev = document.createEvent("Event"); ev.initEvent(name, false, false); window.dispatchEvent(ev); } catch (_) {} }

  function clearTimers() { while (timers.length) clearTimeout(timers.pop()); }

  /* reduced motion: honoured unless data-respect-reduced-motion="false" */
  var respect = root.getAttribute("data-respect-reduced-motion") !== "false";
  var reduced = respect && window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  if (reduced) { root.setAttribute("data-motion", "reduced"); root.style.setProperty("--t-exit", "1.8s"); }
  var exitMs = cssMs("--t-exit", 3300);

  function cleanup() {
    if (gone) return; gone = true; clearTimers();
    root.removeEventListener("click", leave);
    document.removeEventListener("keydown", onKey);
    document.removeEventListener("visibilitychange", onVis);
    root.removeEventListener("transitionend", onEnd);
    if (root.parentNode) root.parentNode.removeChild(root);
    emit("fullradar:intro-end");
  }
  function onEnd(e) { if (e.target === root && e.propertyName === "opacity") cleanup(); }
  function leave() {
    if (left) return; left = true; clearTimers();
    emit("fullradar:intro-leave");
    root.classList.add("is-leaving");
    root.addEventListener("transitionend", onEnd);
    timers.push(setTimeout(cleanup, 1200));              // safety net if transitionend never fires
  }
  function onKey(e) { var k = e.key; if (k === "Escape" || k === "Enter" || k === " " || k === "Spacebar") leave(); }
  function onVis() { if (document.hidden) leave(); }     // nobody is watching: skip quietly

  function play() {
    if (playing || left) return; playing = true;
    root.classList.add("is-playing");                    // releases the paused animations
    timers.push(setTimeout(function () { emit("fullradar:intro-soon"); }, Math.max(0, exitMs - 500)));
    timers.push(setTimeout(leave, exitMs));
  }

  root.addEventListener("click", leave);
  document.addEventListener("keydown", onKey);
  document.addEventListener("visibilitychange", onVis);

  /* wait for web fonts (max 0.9s) so letters never reflow mid-animation */
  var fr = document.fonts && document.fonts.ready;
  if (fr && fr.then) { timers.push(setTimeout(play, 900)); fr.then(play, play); } else play();
})();

<script>
/* ======== ATMOSPHERE ENGINE (same code as atmosphere.js) ======== */
/* =====================================================================

   ===================================================================== */
const Atmosphere = (() => {
  const TAU = Math.PI * 2, rnd = Math.random;

    day:     [[52, 30, 142], [100, 66, 208], [158, 128, 232]],
    dusk:    [[56, 38, 128], [176, 80, 122], [255, 179, 107]],
    night:   [[8, 5, 28],    [26, 16, 70],   [52, 34, 112]],
    ovDay:   [[74, 68, 104], [106, 98, 140], [146, 138, 172]],
    ovNight: [[12, 9, 26],   [24, 18, 46],   [42, 34, 70]],

    day:    [[255, 255, 255], [240, 234, 252], [184, 170, 216]],
    storm:  [[158, 150, 186], [112, 102, 144], [64, 56, 94]],
    night:  [[134, 116, 186], [84, 68, 138],   [42, 30, 82]],
    nstorm: [[68, 58, 100],    [40, 32, 68],    [18, 12, 38]],

  let thunder = false, first = true, bolt = null, boltX = 0, nextBolt = 6, nextStar = 4;
  const par = { x: 0, y: 0, tx: 0, ty: 0 };           // parallax (pointer / tilt)

  let rects = [], surfSel = null, dirty = true, buckets = [[], [], []], vigTex, raysTex = [], skySig = "", skyCols = null;
  let lvl = 0, frames = 0, born = 0, lastRefresh = 0;   // lvl: 0 full | 1 30fps + fewer particles | 2 also drops the glass blur

  /* ---------- input from the weather data ---------- */

    const code = d.code || 0, p = d.precip || 0;

    const c = document.createElement("canvas"); c.width = 512; c.height = 256;
    const g = c.getContext("2d"); let s = seed; const r = () => (s = (s * 16807) % 2147483647) / 2147483647;

  }
  function makeMoon(ph) {                               // craters, maria and a real phase from today's date
    const c = document.createElement("canvas"); c.width = c.height = 256; const g = c.getContext("2d"), R = 128;
    g.save(); g.beginPath(); g.arc(R, R, R - 1, 0, TAU); g.clip();
    const b = g.createRadialGradient(R * .8, R * .75, 10, R, R, R); b.addColorStop(0, "#fbf9ec"); b.addColorStop(1, "#cfcbb6");
    g.fillStyle = b; g.fillRect(0, 0, 256, 256);

      const m = g.createRadialGradient(x, y, 0, x, y, r); m.addColorStop(0, `rgba(70,72,85,${a})`); m.addColorStop(1, "rgba(70,72,85,0)");

    }

      g.lineWidth = 1.5; g.strokeStyle = "rgba(60,62,75,.22)"; g.beginPath(); g.arc(x, y, r, 0, TAU); g.stroke();

  }

    const c = document.createElement("canvas"); c.width = c.height = 512; const g = c.getContext("2d"); g.translate(256, 256);
    for (let i = 0; i < 14; i++) {
      const a0 = i * TAU / 14, wd = .07 + .03 * Math.sin(i * 2.1), rg = g.createRadialGradient(0, 0, 28, 0, 0, 256);
      rg.addColorStop(0, rgb(col)); rg.addColorStop(1, rgb(col, 0));
      g.fillStyle = rg; g.beginPath(); g.moveTo(0, 0); g.arc(0, 0, 256, a0, a0 + wd); g.closePath(); g.fill();
    }
    return c;
  }
  function buildVig() {                                  // vignette baked once per resize
    vigTex = document.createElement("canvas"); vigTex.width = W; vigTex.height = H;
    const g = vigTex.getContext("2d"), vg = g.createRadialGradient(W / 2, H * .45, Math.min(W, H) * .35, W / 2, H * .5, Math.max(W, H) * .8);
    vg.addColorStop(0, "rgba(0,0,8,0)"); vg.addColorStop(1, "rgba(0,0,8,1)"); g.fillStyle = vg; g.fillRect(0, 0, W, H);
  }
  function build() {
    const syn = 29.530588853, ref = Date.UTC(2000, 0, 6, 18, 14);
    moonTex = makeMoon((((Date.now() - ref) / 864e5) % syn + syn) % syn / syn);
    for (const k in CLOUD) sprites[k] = [1, 2, 3, 4].map(s => makeCloud(CLOUD[k], s * 7919));
    const tints = [[255, 255, 255], [255, 255, 255], [208, 192, 255], [255, 226, 190]];
    stars = Array.from({ length: 170 }, () => ({ x: rnd(), y: rnd() * .72, r: .4 + Math.pow(rnd(), 3) * 1.6, b: .3 + rnd() * .7, sp: .6 + rnd() * 2.4, ph: rnd() * TAU, c: tints[(rnd() * 4) | 0] }));
    stars.forEach(s => { s.col = rgb(s.c); });
    const order = Array.from({ length: 16 }, (_, i) => i).sort(() => rnd() - .5);
    clouds = order.map((o, i) => ({ thr: (o + .5) / 16 * .95, z: .15 + rnd() * .85, s: i % 4, w: 260 + rnd() * 340, y: 0, x: rnd() * (W + 400) - 200, ph: rnd() * TAU }))
      .sort((a, b) => a.z - b.z).map(c => (c.y = lerp(.38, .06, c.z) + rnd() * .1, c.w *= .7 + c.z * .6, c));

    buckets = [[], [], []]; drops.forEach(p => buckets[p.z < .55 ? 0 : p.z < .8 ? 1 : 2].push(p));

  }

    if (!surfSel) return;
    rects = [...document.querySelectorAll(surfSel)].map(e => e.getBoundingClientRect())
      .filter(r => r.top > 30 && r.top < H - 10 && r.width > 60).map(r => ({ l: r.left, r: r.right, t: r.top }));
  }

  /* ---------- drawing layers ---------- */
  function drawSky() {
    const dusk = S.dusk * (1 - S.cover * .6) * .85, sat = clamp(S.cover * .75 + S.dark * .35);
    const sig = [S.night, S.dusk, S.cover, S.dark, S.fog, S.flash].map(v => (v * 400) | 0).join();
    if (sig !== skySig) {                                // recompute colours only while values are easing

      skyCols = [0, 1, 2].map(i => {
        let c = mix(SKY.day[i], SKY.night[i], S.night);
        c = mix(c, SKY.dusk[i], dusk);
        c = mix(c, mix(SKY.ovDay[i], SKY.ovNight[i], S.night), sat);
        c = mix(c, [180, 170, 198].map(v => v * (1 - S.night * .75)), S.fog * .55);

/* ---------- Language ----------
   Python  ->  JavaScript
   saveuserlanguage(choice)  ->  saveUserLanguage(choice)    (writes the choice so it survives a restart)
   loaduserlanguage()        ->  loadUserLanguage()          (reads it back, "en" if nothing valid is saved)
   The Python file keeps it in FullRadarSettings.json; a website keeps it in the browser's localStorage. */
const LANGS = ["en", "pt"];
function saveUserLanguage(choice){
  try{ localStorage.setItem("fullradar.language", choice); }catch(e){}       // storage blocked: just don't save
}
function loadUserLanguage(){
  try{
    const saved = localStorage.getItem("fullradar.language");               // null when never saved (like FileNotFoundError)
    return LANGS.includes(saved) ? saved : "en";                             // unknown value (like JSONDecodeError) -> "en"
  }catch(e){ return "en"; }
}

/* ---------- Condition label ---------- */
function describe(c, day){
  const code = c.weather_code ?? 0, cl = c.cloud_cover ?? 0, p = c.precipitation;
  if(code >= 95) return t("c_thunder");
  if([71,73,75,77,85,86].includes(code)) return t("c_snow");
  if(code === 45 || code === 48) return t("c_fog");
  if(p >= 4) return t("c_heavy");
  if(p > 0) return t("c_light");
  if(cl >= 85) return t("c_overcast");
  if(cl >= 50) return day ? t("c_mostly") : t("c_cloudynight");
  if(cl >= 20) return day ? t("c_partly") : t("c_partlynight");
  return day ? t("c_sunny") : t("c_clearnight");
}

/* ---------- Data ---------- */
async function getJSON(url){
  const r = await fetch(url);
  if(!r.ok) throw new Error("Request failed (" + r.status + ")");
  return r.json();
}
async function lookup(city){
  if(BACKEND_URL){
    return getJSON(`${BACKEND_URL}?city=${encodeURIComponent(city)}`);
  }
  const g = await getJSON(`${GEO}?name=${encodeURIComponent(city)}&count=1&language=${lang}&format=json`);
  if(!g.results || !g.results.length) return null;
  const { latitude, longitude, name, country } = g.results[0];
  const forecast = await getJSON(`${FC}?latitude=${latitude}&longitude=${longitude}&current=${CURRENT}&daily=${DAILY}&timezone=auto`);
  return { name, city: name + (country ? ", " + country : ""), latitude, longitude, forecast };
}

/* ---------- Derived presentation (no extra API variables) ---------- */
const fmtTime = iso => iso.slice(11,16);
const mins = iso => +iso.slice(11,13)*60 + +iso.slice(14,16);

function derive(c, d){
  const now = mins(c.time), rise = mins(d.sunrise[0]), set = mins(d.sunset[0]);
  const day = now >= rise && now <= set;
  const t = c.temperature_2m;
  let theme, label;
  if(c.precipitation > 0){ theme = "rain"; label = "Precipitation in progress"; }
  else if(!day){ theme = "night"; label = t < 18 ? "Cool, clear night" : "Mild night"; }
  else if(t >= 34){ theme = "hot"; label = "Very hot"; }
  else if(t >= 26){ theme = "warm"; label = "Warm"; }
  else if(t >= 16){ theme = "mild"; label = "Comfortable"; }
  else { theme = "cool"; label = "Cool"; }
  const p = Math.min(1, Math.max(0, (now - rise) / (set - rise)));
  const nightLen = 1440 - (set - rise);
  const np = Math.min(1, Math.max(0, (now >= set ? now - set : now + 1440 - set) / nightLen));
  const light = Math.min(1, Math.max(0, (Math.min(now - rise, set - now) + 30) / 60));   // 0 night .. 1 full day, eased over sunrise/sunset
  return { theme, label, day, p, np, light };
}

function arcSVG(p, day){
  const cx=150, cy=130, r=120;
  const x = cx - r*Math.cos(Math.PI*p), y = cy - r*Math.sin(Math.PI*p);
  const done = `M ${cx-r} ${cy} A ${r} ${r} 0 0 1 ${x.toFixed(1)} ${y.toFixed(1)}`;
  return `<svg class="arc" viewBox="0 0 300 150" role="img" aria-label="${t("arcAria")}">
    <path d="M ${cx-r} ${cy} A ${r} ${r} 0 0 1 ${cx+r} ${cy}" fill="none" stroke="rgba(255,255,255,.18)" stroke-width="2" stroke-dasharray="3 6" stroke-linecap="round"/>
    ${day ? `<path d="${done}" fill="none" stroke="var(--accent)" stroke-width="3" stroke-linecap="round"/>` : ""}
    <line x1="10" y1="${cy}" x2="290" y2="${cy}" stroke="rgba(255,255,255,.18)"/>
    <circle cx="${day?x.toFixed(1):(p>=1?cx+r:cx-r)}" cy="${day?y.toFixed(1):cy}" r="${day?9:5}" fill="${day?"var(--accent)":"rgba(255,255,255,.4)"}"/>
    ${day ? `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="16" fill="var(--accent)" opacity=".2"/>` : ""}
  </svg>`;
}

/* Smart warnings: same rules as the Python file */
function warningsHTML(c){
  const w = [];
  const icon = (k, size) => ico[k].replace(/width="\d+" height="\d+"/, `width="${size}" height="${size}"`);
  if(c.precipitation > 0) w.push(["alert","rain","wRain","wRainAlert"]);
  else w.push(["ok","rain","wRain","wRainOk"]);
  if(c.wind_speed_10m > 20) w.push(["alert","wind","wWind","wWindAlert"]);
  else w.push(["ok","wind","wWind","wWindOk"]);
  if(c.apparent_temperature - c.temperature_2m >= 2) w.push(["alert","sun","wHeat","wHeatMsg"]);
  if(c.temperature_2m < 15) w.push(["alert","snow","wCold","wColdMsg"]);
  if(c.relative_humidity_2m < 30) w.push(["alert","drop","wDry","wDryMsg"]);
  const n = w.filter(x => x[0] === "alert").length;
  return `<section class="card warn" aria-label="${t("warnTitle")}">
    <div class="warn-head"><h2>${t("warnTitle")}</h2><span class="pill ${n ? "hot" : ""}">${n ? t(n > 1 ? "activeMany" : "activeOne", { n }) : t("allClear")}</span></div>
    <div class="wlist">${w.map(([k, i, title, msg]) => `<div class="wi ${k}"><div class="wic">${icon(i,20)}</div><div><strong>${t(title)}</strong><p>${t(msg)}</p></div></div>`).join("")}</div>
  </section>`;
}

/* Recommended activity: same rules as recommendedactivity() in the Python file (first matching rule wins) */
function activityHTML(c){
  const tp = c.temperature_2m, h = c.relative_humidity_2m, w = c.wind_speed_10m, p = c.precipitation;
  let run, gym;
  if(tp > 30) run = ["alert", "r1"];
  else if(h <= 30) run = ["alert", "r2"];
  else if(tp <= 10) run = ["alert", "r3"];
  else if(w >= 10) run = ["alert", "r4"];
  else if(p > 0) run = ["alert", "r5"];
  else run = ["ok", "r6"];
  if(tp > 30) gym = ["alert", "g1"];
  else if(h <= 30) gym = ["alert", "g2"];
  else if(p > 0) gym = ["alert", "g3"];
  else gym = ["ok", "g4"];
  const care = run[0] === "alert" || gym[0] === "alert";
  return `<section class="card warn" aria-label="${t("actTitle")}">
    <div class="warn-head"><h2>${t("actTitle")}</h2><span class="pill ${care ? "hot" : ""}">${care ? t("takeCare") : t("goodGo")}</span></div>
    <div class="wlist">
      <div class="wi ${run[0]}"><div class="wic">${ico.run}</div><div><strong>${t("running")}</strong><p>${t(run[1])}</p></div></div>
      <div class="wi ${gym[0]}"><div class="wic">${ico.gym}</div><div><strong>${t("gym")}</strong><p>${t(gym[1])}</p></div></div>
    </div>
  </section>`;
}

/* Next 7 days: same fields as nextdays() in the Python file (date, max, min, rain probability) */
function weekHTML(d){
  const days = d.time || [], mx = d.temperature_2m_max || [], mn = d.temperature_2m_min || [], rn = d.precipitation_probability_max || [];
  const n = Math.min(7, days.length); if(!n) return "";
  const lo = Math.min(...mn.slice(0, n)), hi = Math.max(...mx.slice(0, n)), span = Math.max(1, hi - lo);
  const fmt = (iso, o) => new Date(iso + "T00:00:00Z").toLocaleDateString(LOC(), { timeZone: "UTC", ...o });
  const rows = Array.from({ length: n }, (_, i) => {
    const l = (mn[i] - lo) / span * 100, w = Math.max(6, (mx[i] - mn[i]) / span * 100);
    return `<div class="wk"><div class="wk-d"><strong>${i === 0 ? t("today") : fmt(days[i], { weekday: "short" })}</strong><span>${fmt(days[i], { month: "short", day: "numeric" })}</span></div>
      <div class="wk-r">${ico.drop}${rn[i] == null ? "-" : rn[i] + "%"}</div>
      <div class="wk-b"><i style="left:${l.toFixed(1)}%;width:${w.toFixed(1)}%"></i></div>
      <div class="wk-t"><span>${T(mn[i])}°</span><strong>${T(mx[i])}°</strong></div></div>`;
  }).join("");
  return `<section class="card week" aria-label="${t("week")}"><h2>${t("week")}</h2><div>${rows}</div></section>`;
}

function render(res){
  mode = "result"; lastRes = res;
  const { city, latitude, longitude, forecast } = res;
  const c = forecast.current, d = forecast.daily;
  const { theme, day, p, np, light } = derive(c, d);
  const label = describe(c, day);
  document.body.dataset.theme = theme;
  setScene({ day, light, p, np, cloud: c.cloud_cover ?? 0, precip: c.precipitation, wind: c.wind_speed_10m, code: c.weather_code ?? 0, temp: c.temperature_2m });

  const tMax = d.temperature_2m_max[0], tMin = d.temperature_2m_min[0], pr = d.precipitation_probability_max?.[0];
  const pos = tMax === tMin ? 50 : Math.min(100, Math.max(0, (c.temperature_2m - tMin) / (tMax - tMin) * 100));
  const wind = Math.min(100, c.wind_speed_10m / 60 * 100);

  view.html = `<div class="dash reveal">
    <section class="card hero" aria-label="${t("aCurrent")}">
      <div class="hero-top"><div><div class="place">${ico.pin}<span>${esc(city)}</span></div>
        <div class="coords">Lat ${nf(latitude, 2)}, Lon ${nf(longitude, 2)}</div></div>
        <button class="favbtn ${isFav(currentName) ? "on" : ""}" id="favbtn" type="button" aria-pressed="${isFav(currentName)}">${ico.star}<span>${isFav(currentName) ? t("saved") : t("save")}</span></button></div>
      <div><div class="temp">${T(c.temperature_2m)}<sup class="tu">${U()}</sup></div>
        <div class="cond">${label}</div></div>
    </section>

    <section class="metrics" aria-label="${t("aMetrics")}">
      <div class="card metric"><div class="lbl">${ico.drop}${t("humidity")}</div>
        <div><div class="val">${c.relative_humidity_2m}<small>%</small></div></div>
        <div class="bar"><i style="width:${c.relative_humidity_2m}%"></i></div></div>
      <div class="card metric"><div class="lbl">${ico.therm}${t("feels")}</div>
        <div><div class="val">${T(c.apparent_temperature)}<small class="tu">${U()}</small></div></div>
        <div class="hint">${c.apparent_temperature > c.temperature_2m + 1 ? t("warmer") : c.apparent_temperature < c.temperature_2m - 1 ? t("cooler") : t("close")}</div></div>
      <div class="card metric"><div class="lbl">${ico.rain}${t("precip")}</div>
        <div><div class="val">${nf(c.precipitation)}<small>mm</small></div></div>
        <div class="hint">${c.precipitation > 0 ? t("falling") : t("none")}</div></div>
      <div class="card metric"><div class="lbl">${ico.wind}${t("wind")}</div>
        <div><div class="val">${nf(c.wind_speed_10m)}<small>Km/h</small></div></div>
        <div class="bar"><i style="width:${wind}%"></i></div></div>
    </section>

    ${warningsHTML(c)}

    ${activityHTML(c)}

    <section class="card range" aria-label="${t("range")}">
      <h2>${t("range")}</h2>
      <div class="minmax">
        <div class="n"><span>${t("min")}</span>${T(tMin)}°</div>
        <div class="track"><b style="left:${pos}%"></b></div>
        <div class="n"><span>${t("max")}</span>${T(tMax)}°</div>
      </div>
      ${pr == null ? "" : `<div class="rainrow">${ico.drop}<span>${t("maxPrecip")}</span><strong>${pr}%</strong></div><div class="bar"><i style="width:${pr}%"></i></div>`}
      <p class="hint" style="margin-top:16px">${t("rangeHint")}</p>
    </section>

    <section class="card horizon" aria-label="${t("aHorizon")}">
      <h2>${t("horizon")}</h2>
      ${arcSVG(p, day)}
      <div class="times">
        <div>${ico.rise}<div><strong>${fmtTime(d.sunrise[0])}</strong><span>${t("sunrise")}</span></div></div>
        <div>${ico.set}<div><strong>${fmtTime(d.sunset[0])}</strong><span>${t("sunset")}</span></div></div>
      </div>
    </section>

    ${weekHTML(d)}
  </div>`;
}

/* ---------- Temperature unit (C / F) ----------
   The API data and every rule (warnings, activity, heat stress) stay in Celsius.
   Only the displayed numbers are converted, so a Fahrenheit user gets the same advice. */
let unit = "C";
try{ if(localStorage.getItem("fullradar.unit") === "F") unit = "F"; }catch(e){}
const cvt = v => (Math.round(unit === "F" ? v * 9 / 5 + 32 : v) || 0);
const T = v => `<span class="tv" data-c="${v}">${cvt(v)}</span>`;     // number that can be re-converted in place
const U = () => "&deg;" + unit;
function applyUnit(){
  document.querySelectorAll(".tv").forEach(e => { e.textContent = cvt(+e.dataset.c); });
  document.querySelectorAll(".tu").forEach(e => { e.innerHTML = U(); });
  document.querySelectorAll("#seg button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.unit === unit)));
}

/* ---------- Favorites (saved on this device) ---------- */
const FKEY = "fullradar.favorites";
let favs = [], currentName = "", favTok = 0;
try{ favs = JSON.parse(localStorage.getItem(FKEY) || localStorage.getItem("gnnw.favorites") || "[]"); }catch(e){ favs = []; }   // falls back to the pre-rename key so saved cities survive
if(!Array.isArray(favs)) favs = [];
const saveFavs = () => { try{ localStorage.setItem(FKEY, JSON.stringify(favs)); }catch(e){} };
const isFav = n => !!n && favs.some(f => f.toLowerCase() === n.toLowerCase());
function addFav(n){ if(n && !isFav(n)){ favs.push(n); saveFavs(); } renderFavs(); }
function removeFav(n){ favs = favs.filter(f => f.toLowerCase() !== n.toLowerCase()); saveFavs(); renderFavs(); }
function renderFavs(){
  const el = $("favs");
  el.classList.toggle("on", favs.length > 0);
  el.innerHTML = favs.length ? `<span class="lbl">${t("favs")}</span>` +
    favs.map(n => `<span class="fchip"><button type="button" data-city="${esc(n)}">${esc(n)}</button><button class="x" type="button" data-remove="${esc(n)}" aria-label="${esc(t("remove", { n }))}">&times;</button></span>`).join("") +
    `<button class="vall" type="button" id="vall">${t("viewAll")}</button>` : "";
}
function warnCount(c){
  return (c.precipitation > 0) + (c.wind_speed_10m > 20) + (c.apparent_temperature - c.temperature_2m >= 2) + (c.temperature_2m < 15) + (c.relative_humidity_2m < 30);
}
async function showFavorites(){
  favTok++; const tok = favTok; mode = "favs";
  document.body.dataset.theme = "night";
  if(!favs.length){
    setStatus("", "noFavs");
    view.html = `<div class="card empty">${ico.search}<h2>${t("noFavs")}</h2><p>${t("favEmptyText")}</p></div>`;
    return;
  }
  setStatus("busy", "loadingFavs");
  view.html = `<div class="dash favgrid" aria-busy="true">${"<div class='card fav'><div class='sk' style='height:130px'></div></div>".repeat(Math.min(favs.length,3))}</div>`;
  const list = favs.slice();
  const results = await Promise.allSettled(list.map(n => lookup(n)));
  if(tok !== favTok) return;
  const cards = results.map((r, i) => {
    const name = list[i];
    if(r.status !== "fulfilled" || !r.value){
      const missing = r.status === "fulfilled";
      return `<button class="card fav" type="button" data-city="${esc(name)}"><div class="place">${ico.pin}<span>${esc(name)}</span></div><div class="hint">${missing ? t("cityMissing") : t("retry")}</div></button>`;
    }
    const { city, forecast } = r.value, c = forecast.current, d = forecast.daily;
    const n = warnCount(c), label = describe(c, derive(c, d).day);
    return `<button class="card fav" type="button" data-city="${esc(name)}">
      <div class="fav-top"><span class="place">${ico.pin}<span>${esc(city)}</span></span><span class="pill ${n ? "hot" : ""}">${n ? t(n > 1 ? "alertMany" : "alertOne", { n }) : t("clear")}</span></div>
      <div class="fav-temp">${T(c.temperature_2m)}<sup class="tu">${U()}</sup></div>
      <div class="cond" style="margin:0">${label}</div>
      <div class="fav-meta"><span>${ico.drop}${c.relative_humidity_2m}%</span><span>${ico.wind}${nf(c.wind_speed_10m)} Km/h</span><span>${T(d.temperature_2m_min[0])}° / ${T(d.temperature_2m_max[0])}°</span></div></button>`;
  }).join("");
  setStatus("ok", "favsUpdated");
  view.html = `<div class="dash favgrid reveal"><div class="fav-head"><h2>${t("favHead")}</h2><span class="hint">${t("savedN", { n: list.length })}</span></div>${cards}</div>`;
}

/* ---------- Events ---------- */
async function search(city){
  city = city.trim();
  if(!city) return;
  favTok++;
  btn.disabled = true;
  setStatus("busy", "looking", { city });
  showLoading();
  try{
    const res = await lookup(city);
    if(!res){
      setStatus("err", "noMatch");
      showError("notFoundTitle", "notFoundMsg", { city });
    } else {
      setStatus("ok", "updated", { city: res.city });
      currentName = res.name || res.city.split(",")[0];
      addFav(currentName);
      render(res);
    }
  }catch(e){
    setStatus("err", "connProblem");
    console.error(e);
    showError("failTitle", "failMsg", { e: e.message || "network error" });
  }finally{ btn.disabled = false; }
}
$("form").addEventListener("submit", e => { e.preventDefault(); search($("city").value); });
out.addEventListener("click", e => {
  const chip = e.target.closest(".chip, .fav");
  if(chip){ $("city").value = chip.dataset.city; search(chip.dataset.city); return; }
  const fb = e.target.closest("#favbtn");
  if(fb){
    const on = isFav(currentName);
    if(on) removeFav(currentName); else addFav(currentName);
    fb.classList.toggle("on", !on);
    fb.setAttribute("aria-pressed", String(!on));
    fb.querySelector("span").textContent = on ? t("save") : t("saved");
  }
});
$("favs").addEventListener("click", e => {
  const rm = e.target.closest("[data-remove]");
  if(rm){ removeFav(rm.dataset.remove); return; }
  if(e.target.closest("#vall")){ showFavorites(); return; }
  const c = e.target.closest("[data-city]");
  if(c){ $("city").value = c.dataset.city; search(c.dataset.city); }
});
/* Touch / click reaction: keep the lift visible long enough to notice on quick taps */
out.addEventListener("pointerdown", e => {
  const card = e.target.closest(".dash .card");
  if(!card) return;
  card.classList.add("lift");
  const drop = () => setTimeout(() => card.classList.remove("lift"), 380);
  card.addEventListener("pointerup", drop, { once:true });
  card.addEventListener("pointercancel", drop, { once:true });
  card.addEventListener("pointerleave", drop, { once:true });
});
$("seg").addEventListener("click", e => {
  const b = e.target.closest("button[data-unit]"); if(!b || b.dataset.unit === unit) return;
  unit = b.dataset.unit; try{ localStorage.setItem("fullradar.unit", unit); }catch(err){}
  applyUnit();
});
/* Redraw everything in the current language: fixed text via data-i18n attributes, then the part that is on screen */
function applyLanguage(){
  document.documentElement.lang = lang === "pt" ? "pt-BR" : "en";
  document.title = t("title");
  document.querySelectorAll("[data-i18n]").forEach(e => { e.textContent = t(e.dataset.i18n); });
  document.querySelectorAll("[data-i18n-ph]").forEach(e => { e.placeholder = t(e.dataset.i18nPh); });
  document.querySelectorAll("[data-i18n-aria]").forEach(e => { e.setAttribute("aria-label", t(e.dataset.i18nAria)); });
  document.querySelectorAll("#lang button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.lang === lang)));
  setStatus(...lastStatus);
  renderFavs();
  if(mode === "result" && lastRes) render(lastRes);
  else if(mode === "favs") showFavorites();
  else if(mode === "error" && lastErr) showError(...lastErr);
  else showEmpty();
}
$("lang").addEventListener("click", e => {
  const b = e.target.closest("button[data-lang]"); if(!b || b.dataset.lang === lang) return;
  lang = b.dataset.lang; saveUserLanguage(lang); applyLanguage();
});
applyUnit();
/* Intro hand-off: the sky engine starts just before the intro leaves (so it never competes with the intro's frames),
   and the dashboard fades in underneath while the intro fades out. */
let atmoStarted = false;
function startAtmo(){ if(atmoStarted) return; atmoStarted = true; Atmosphere.init($("atmo"), { surfaces: ".dash .card" }); }
addEventListener("fullradar:intro-soon", startAtmo);
addEventListener("fullradar:intro-leave", () => { startAtmo(); document.body.classList.add("ready"); });
if(!$("fr-intro")){ startAtmo(); document.body.classList.add("ready"); }
applyLanguage();
</script>
</body>
